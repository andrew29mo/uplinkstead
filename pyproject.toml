[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uplinkstead"
version = "0.1.0"
description = "Local Linux IPv4 dual-uplink failover service"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
uplinkstead = "uplinkstead.cli:main"

[tool.setuptools.packages.find]
include = ["uplinkstead*"]
